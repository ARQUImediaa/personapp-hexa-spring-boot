# Laboratorio 2: MariaDB + MongoDB + API REST (Spring Boot, puerto 3000)
# Uso: docker compose up -d --build
# Limpiar todo (borra datos): docker compose down -v
services:
  maria:
    image: mariadb:10.11
    container_name: personapp-maria
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      # Solo corren en la primera inicialización del volumen
      - ./scripts/persona_ddl_maria.sql:/docker-entrypoint-initdb.d/1-ddl.sql:ro
      - ./scripts/persona_dml_maria.sql:/docker-entrypoint-initdb.d/2-dml.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:6
    container_name: personapp-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping: 1})"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Ejecuta los scripts de Mongo con mongosh por stdin (el entrypoint de la imagen no los aplica)
  mongo-init:
    image: mongo:6
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - >
        mongosh --host mongo --username root --password root --authenticationDatabase admin --quiet < /scripts/persona_ddl_mongo.js &&
        mongosh --host mongo --username root --password root --authenticationDatabase admin --quiet < /scripts/persona_dml_mongo.js

  api-rest:
    build:
      context: .
      dockerfile: docker/rest.Dockerfile
    container_name: personapp-api
    depends_on:
      maria:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://maria:3306/persona_db
      SPRING_DATA_MONGODB_HOST: mongo
    ports:
      - "3000:3000"

  # CLI interactivo (menú en la terminal). No se levanta con "up -d"; se usa así:
  #   docker compose run --rm cli
  cli:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: docker/cli.Dockerfile
    depends_on:
      maria:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://maria:3306/persona_db
      SPRING_DATA_MONGODB_HOST: mongo
